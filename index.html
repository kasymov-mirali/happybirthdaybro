<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e0a16">
  <title>Мили Броуски, это для тебя 🎂</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body class="theme-cover" data-banner="С ДНЁМ РОЖДЕНИЯ" data-decor="✨,🎈,💜,⭐,🎉,✦">
  <main class="cover">
    <div class="glass">
      <!-- Обратный отсчёт: виден до 14 декабря, потом сам исчезает и появляется вход -->
      <div class="countdown" aria-live="polite">
        <div class="cake-wrap"><div class="cake" aria-hidden="true">🎁</div></div>
        <h1 class="shine">Мили Броуски, тут кое-что для тебя</h1>
        <p class="cd-sub">Откроется 14 декабря. Ни секундой раньше 😏</p>
        <div class="cd-grid">
          <div class="cd-cell"><b data-cd="d">00</b><span>дней</span></div>
          <div class="cd-cell"><b data-cd="h">00</b><span>часов</span></div>
          <div class="cd-cell"><b data-cd="m">00</b><span>минут</span></div>
          <div class="cd-cell"><b data-cd="s">00</b><span>секунд</span></div>
        </div>
        <p class="cd-note">сохрани ссылку и возвращайся 🎂</p>
      </div>

      <div class="gate-wrap">
        <div class="cake-wrap"><div class="cake" aria-hidden="true">🎂</div></div>
        <h1 class="shine">Мили Броуски, это для тебя</h1>
        <form id="gate" class="gate" autocomplete="off">
          <label for="word">Секретное слово: кто мы друг другу?</label>
          <input id="word" name="word" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="…" enterkeyhint="go" required>
          <button class="btn" type="submit">Войти</button>
          <div class="err" aria-live="polite"></div>
        </form>
      </div>

      <div class="welcome">
        <span class="age" aria-hidden="true">21</span>
        <h1 class="big shine">С днём рождения, Лапка!</h1>
        <p>21 — это уже серьёзно (нет)</p>
        <a class="btn" href="valorant.html" data-ds="щас, сначала кое-что покажу 👀">пошли в дс? 🎮</a>
      </div>
    </div>
  </main>
  <script src="js/main.js?v=18"></script>
</body>
</html>
